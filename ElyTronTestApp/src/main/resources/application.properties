spring.application.name=ElyTronTestApp
#server.address=127.0.0.1
server.port=8081
elytron.store.enabled=true
# these are defined in the tomcat startup
#elytron.store.path=sample.cs
#elytron.store.unlock-password=${ELYTRON_STORE_PASSWORD:}
elytron.store.credentials-property=app.credentials
elytron.store.property-prefix=app


# Dummy defaults that the sample store overrides at startup.
app.userid=fallback-user
app.password=fallback-password
app.oimadmin=oimadmin
app.oimadminpw=oimadminpw
app.soapassword=soapw
app.soauserid=soauserid
